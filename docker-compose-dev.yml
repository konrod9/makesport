networks:
  default:
    name: "makesport"

volumes:
  makesport-pg-data:

services:
  venues-service:
    container_name: makesport-venues-service
    build:
      context: ./backend
      dockerfile: VenuesService/Dockerfile
      args:
        NUGET_USERNAME: ${NUGET_USERNAME}
        NUGET_PASSWORD: ${NUGET_PASSWORD}
    ports:
      - "5163:5163"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:5163
    env_file:
      - .env

  venues-migrations:
    container_name: venues-migrations
    build:
      context: ./backend
      dockerfile: VenuesService/Dockerfile
      args:
        NUGET_USERNAME: ${NUGET_USERNAME}
        NUGET_PASSWORD: ${NUGET_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    environment:
      - ConnectionStrings__Database=${DATABASE_VENUES_CONNECTION}
    env_file:
      - .env
    entrypoint:
      ["/bin/sh", "-c", './efbundle --connection "$DATABASE_VENUES_CONNECTION"']

  file-service:
    container_name: makesport-file-service
    build:
      context: ./backend
      dockerfile: FileService/Dockerfile
      args:
        NUGET_USERNAME: ${NUGET_USERNAME}
        NUGET_PASSWORD: ${NUGET_PASSWORD}
    ports:
      - "8002:8002"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8002
      - ConnectionStrings__Database=${DATABASE_FILE_SERVICE_CONNECTION}
    env_file:
      - .env

  # file-service-migrations:
  #   container_name: file-service-migrations
  #   build:
  #     context: ./backend
  #     dockerfile: FileService/Dockerfile
  #     args:
  #       NUGET_USERNAME: ${NUGET_USERNAME}
  #       NUGET_PASSWORD: ${NUGET_PASSWORD}
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   restart: "no"
  #   environment:
  #     - ConnectionStrings__Database=${DATABASE_FILE_SERVICE_CONNECTION}
  #   env_file:
  #     - .env
  #   entrypoint:
  #     [
  #       "/bin/sh",
  #       "-c",
  #       './efbundle --connection "$DATABASE_FILE_SERVICE_CONNECTION"',
  #     ]

  postgres:
    container_name: makesport-pg
    image: postgis/postgis:17-3.5
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: makesport-db
    volumes:
      - makesport-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makesport-db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  seq:
    container_name: makesport-seq
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "8081:80"
      - "5341:5341"
    restart: always

  minio:
    container_name: makesport-minio
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server --console-address ":9001" /data
    restart: always

  redis:
    container_name: makesport-redis
    image: redis:alpine
    ports:
      - "6379:6379"

  nginx:
    container_name: makesport-nginx
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - venues-service
      - file-service
      #- minio

