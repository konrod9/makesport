stages:
  - lint
  - test
  - deploy

client-lint:
  stage: lint
  image: node:25-alpine
  cache:
    key: $CI_COMMIT_REF_SLUG-client
    paths:
      - client/node_modules/
  script:
    - cd client
    - npm ci --legacy-peer-deps
    - npm run lint

client-build:
  stage: test
  image: node:25-alpine
  cache:
    key: $CI_COMMIT_REF_SLUG-client
    paths:
      - client/node_modules/
  variables:
    NEXT_PUBLIC_API_BASE_URL: "https://make-sport.ru/api"
    NEXT_PUBLIC_YMAPS_JS_API_KEY: "$NEXT_PUBLIC_YMAPS_JS_API_KEY"
    NEXT_PUBLIC_YMAPS_GEOCODER_API_KEY: "$NEXT_PUBLIC_YMAPS_GEOCODER_API_KEY"
  script:
    - cd client
    - npm ci --legacy-peer-deps
    - npm run build

backend-tests:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  services:
    - name: docker:dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    NUGET_USERNAME: gitlab-ci-token
    NUGET_PASSWORD: "$CI_JOB_TOKEN"
    NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget
  cache:
    key: $CI_COMMIT_REF_SLUG-nuget
    paths:
      - .nuget/
  script:
    - cd backend
    - dotnet nuget update source gitlab --username "$NUGET_USERNAME" --password "$NUGET_PASSWORD" --store-password-in-clear-text --configfile nuget.config
    - dotnet test VenuesService/VenuesService.sln
    - dotnet test FileService/FileService.sln

deploy:
  stage: deploy
  image: alpine:latest
  only:
    - main
  variables:
    VPS_HOST: "$VPS_HOST"
    VPS_USER: "$VPS_USER"
    VPS_DIR: "$VPS_DIR"
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh "$VPS_USER@$VPS_HOST" "cd $VPS_DIR && git pull origin main &&
      docker compose -f docker-compose-prod.yml build &&
      docker compose -f docker-compose-prod.yml up -d postgres minio redis &&
      docker compose -f docker-compose-prod.yml --profile migrations up venues-migrations file-service-migrations &&
      docker compose -f docker-compose-prod.yml up -d"
