networks:
  default:
    name: "makesport"

volumes:
  makesport-pg-data:

services:
  postgres:
    container_name: makesport-pg
    image: postgres:16-alpine
    ports:
        - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: makesport-db
    volumes:
      - makesport-pg-data:/var/lib/postgresql/data
  
  pgadmin:
    container_name: makesport-pgadmin
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    depends_on:
        - postgres